<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock, Paper, Scissors</h1><br>
    <h3>Please select: </h3><br>
    <div id ="container">
    <button><img src = "images/rock.png" alt = "rock" class = "weapon" id = "rock"></button> 
    <button><img src = "images/paper.png" alt = "paper" class = "weapon" id = "paper"></button>
    <button><img src = "images/scissors.png" alt = "scissors" class = "weapon" id = "scissors"></button>
    </div>
    <div id= "container2"><br>
        <div id = "stats">
            <p id = "result">Result: </p>
            <p id = "playerScore">Player Score: 0 </p>
            <p id = "computerScore">Computer Score: 0 </p>
            <p id = "ties">Ties: 0 </p>
            <p id = "rounds">Round: 1 </p>  
        </div>
            <button id = "restart">Restart</button>
    </div> 
</body>
</html>
